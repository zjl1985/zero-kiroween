<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101827" />
    <title>猫猫守夜</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body data-style="papercraft" data-cat="zero" data-screen="title">
    <div id="app">
      <canvas id="game" width="960" height="540" aria-label="猫猫守夜"></canvas>
      <section id="title-screen" class="title-layer">
        <header class="title-hero">
          <p id="title-sub" class="eyebrow">MIDNIGHT MEOW</p>
          <h1 id="title-name">猫猫守夜</h1>
          <p id="title-tag" class="tagline"></p>
        </header>
        <!-- The playbill of the paper theater: pick a ticket, read the cat's acts. -->
        <div class="selection-panel playbill">
          <div class="selection-heading">
            <p id="selector-kicker" class="eyebrow"></p>
            <h2 id="cat-choice-label"></h2>
          </div>
          <div
            class="cat-choices"
            role="group"
            aria-labelledby="cat-choice-label"
          >
            <button
              type="button"
              id="btn-cat-zero"
              class="cat-choice ticket"
              aria-pressed="true"
            >
              <canvas width="64" height="52" aria-hidden="true"></canvas
              ><span
                ><strong class="choice-name"></strong
                ><small class="choice-role"></small></span
              ><i aria-hidden="true">✓</i>
            </button>
            <button
              type="button"
              id="btn-cat-nicole"
              class="cat-choice ticket"
              aria-pressed="false"
            >
              <canvas width="64" height="52" aria-hidden="true"></canvas
              ><span
                ><strong class="choice-name"></strong
                ><small class="choice-role"></small></span
              ><i aria-hidden="true">✓</i>
            </button>
          </div>
          <div class="profile">
            <div class="mini-stage" aria-hidden="true">
              <canvas id="profile-portrait" width="64" height="52"></canvas>
            </div>
            <div>
              <div class="profile-title">
                <h3 id="profile-name"></h3>
                <span id="profile-role"></span>
              </div>
              <p id="profile-story"></p>
            </div>
          </div>
          <div class="profile-stats">
            <span id="profile-hp"></span><span id="profile-speed"></span>
          </div>
          <div class="skill-list" tabindex="0">
            <article class="skill-row">
              <canvas
                id="icon-attack"
                width="32"
                height="32"
                aria-hidden="true"
              ></canvas>
              <div>
                <header>
                  <span id="skill-attack-type"></span>
                  <h4 id="skill-attack-name"></h4>
                </header>
                <p id="skill-attack-desc"></p>
              </div>
            </article>
            <article class="skill-row">
              <canvas
                id="icon-active"
                width="32"
                height="32"
                aria-hidden="true"
              ></canvas>
              <div>
                <header>
                  <span id="skill-active-type"></span>
                  <h4 id="skill-active-name"></h4>
                  <kbd id="profile-skill-key">SPACE</kbd>
                </header>
                <p id="skill-active-desc"></p>
              </div>
            </article>
            <article class="skill-row">
              <canvas
                id="icon-passive"
                width="32"
                height="32"
                aria-hidden="true"
              ></canvas>
              <div>
                <header>
                  <span id="skill-passive-type"></span>
                  <h4 id="skill-passive-name"></h4>
                </header>
                <p id="skill-passive-desc"></p>
              </div>
            </article>
          </div>
          <footer class="selection-footer">
            <p id="profile-tactic"></p>
            <p id="profile-build" class="profile-build"></p>
            <button type="button" id="btn-start" class="btn primary magnetic"></button>
            <p id="title-controls" class="hint"></p>
          </footer>
        </div>
        <div class="corner corner-tr">
          <button
            type="button"
            id="btn-mute"
            class="btn ghost sound-toggle"
            aria-pressed="false"
          >
            <span aria-hidden="true">♪</span>
          </button>
          <button type="button" id="btn-lang" class="btn ghost"></button>
        </div>
        <p id="title-credit" class="credit corner-br"></p>
      </section>
      <div id="overlay">
        <!-- Paper theater framing the chosen cat, which the canvas draws on the stage. -->
        <div id="theater" class="theater" aria-hidden="true">
          <div class="valance"></div>
          <div class="curtain curtain-l"></div>
          <div class="curtain curtain-r"></div>
          <div class="stage-lip"></div>
          <div class="hero-caption">
            <span id="hero-kicker" class="eyebrow"></span
            ><strong id="hero-name"></strong><span id="hero-role"></span>
          </div>
        </div>
        <div id="hud" class="hud hidden">
          <div class="watch-badge">
            <canvas
              id="hud-portrait"
              width="64"
              height="52"
              aria-hidden="true"
            ></canvas>
            <div>
              <strong id="hud-name"></strong>
              <span id="hud-kills"></span>
              <span id="hud-buff" class="buff"></span>
            </div>
          </div>
          <div class="night-sky">
            <div class="sky-arc">
              <canvas id="hud-sky" width="440" height="120" aria-hidden="true"></canvas>
              <div class="sky-time">
                <strong id="hud-time"></strong>
                <span id="hud-phase"></span>
              </div>
            </div>
            <canvas
              id="hud-hearts"
              class="lantern-string"
              width="160"
              height="80"
              role="img"
            ></canvas>
          </div>
          <div class="map-corner">
            <div class="hud-actions">
              <button
                type="button"
                id="btn-hud-mute"
                class="btn-chip sound-toggle"
                aria-pressed="false"
              >
                <span aria-hidden="true">♪</span></button
              ><button type="button" id="btn-fullscreen" class="btn-chip">⛶</button
              ><button type="button" id="btn-hud-pause" class="btn-chip">Ⅱ</button>
            </div>
            <canvas
              id="hud-map"
              class="folded-map"
              width="276"
              height="160"
              role="img"
            ></canvas>
          </div>
          <div id="hud-boss" class="boss-bar hidden" role="img">
            <span id="hud-boss-name" class="boss-sleeve"></span>
            <div class="boss-track"><i></i></div>
          </div>
          <div id="hud-streak" class="streak-badge hidden" aria-hidden="true">
            <strong></strong><span></span>
          </div>
          <div id="hud-chest" class="chest-reveal hidden" role="status"></div>
          <div id="boss-banner" class="boss-banner hidden" aria-hidden="true">
            <div class="pleat pleat-1"><span id="boss-banner-kicker"></span></div>
            <div class="pleat pleat-2">
              <strong id="boss-banner-name" class="ink-reveal"></strong>
            </div>
            <div class="pleat pleat-3"><span id="boss-banner-line"></span></div>
          </div>
          <div class="hurt-vignette" aria-hidden="true"></div>
          <div
            id="hud-notice"
            class="notice hidden"
            role="status"
            aria-live="polite"
          ></div>
          <div class="seam-dock">
            <button type="button" id="btn-skill" class="wick">
              <canvas id="hud-wick" width="80" height="128" aria-hidden="true"></canvas
              ><span class="wick-label"
                ><strong id="hud-skill-name"></strong
                ><small id="hud-dash"></small
                ><kbd id="hud-skill-key"></kbd></span>
            </button>
            <div class="seam-col">
              <div id="hud-upgrades" class="seam-tags"></div>
              <div class="seam-row">
                <span id="hud-level" class="level-button"></span>
                <div id="hud-xp" class="seam" role="img"></div>
              </div>
              <p id="hud-hint" class="game-hint"></p>
            </div>
          </div>
        </div>
        <section id="pause-screen" class="panel journal-page folded hidden">
          <p id="pause-kit" class="eyebrow"></p>
          <h2 id="pause-title"></h2>
          <p id="pause-skill" class="panel-copy"></p>
          <p id="pause-note" class="hint"></p>
          <div class="actions">
            <button type="button" id="btn-resume" class="btn primary"></button
            ><button type="button" id="btn-pause-lang" class="btn"></button
            ><button type="button" id="btn-back" class="btn"></button>
          </div>
        </section>
        <section
          id="upgrade-screen"
          class="upgrade-screen hidden"
          aria-labelledby="upgrade-title"
        >
          <p id="upgrade-kicker" class="eyebrow"></p>
          <h2 id="upgrade-title"></h2>
          <div class="upgrade-cards">
            <button type="button" id="upgrade-card-0" class="upgrade-card" style="--deal: 0">
              <span class="card-tag"></span>
              <span class="card-window" aria-hidden="true"
                ><canvas class="card-flower" width="192" height="192"></canvas
                ><canvas class="card-icon" width="96" height="96"></canvas
              ></span>
              <strong class="card-name"></strong>
              <small class="card-level"></small>
              <p class="card-desc"></p>
              <kbd></kbd>
            </button>
            <button type="button" id="upgrade-card-1" class="upgrade-card" style="--deal: 1">
              <span class="card-tag"></span>
              <span class="card-window" aria-hidden="true"
                ><canvas class="card-flower" width="192" height="192"></canvas
                ><canvas class="card-icon" width="96" height="96"></canvas
              ></span>
              <strong class="card-name"></strong>
              <small class="card-level"></small>
              <p class="card-desc"></p>
              <kbd></kbd>
            </button>
            <button type="button" id="upgrade-card-2" class="upgrade-card" style="--deal: 2">
              <span class="card-tag"></span>
              <span class="card-window" aria-hidden="true"
                ><canvas class="card-flower" width="192" height="192"></canvas
                ><canvas class="card-icon" width="96" height="96"></canvas
              ></span>
              <strong class="card-name"></strong>
              <small class="card-level"></small>
              <p class="card-desc"></p>
              <kbd></kbd>
            </button>
          </div>
          <p id="upgrade-hint" class="hint"></p>
        </section>
        <section id="result-screen" class="panel journal-page result-panel hidden">
          <p id="result-date" class="journal-date"></p>
          <p id="result-cat" class="eyebrow"></p>
          <h2 id="result-title"></h2>
          <p id="result-text" class="panel-copy"></p>
          <canvas
            id="result-paw"
            class="paw-stamp"
            width="144"
            height="144"
            role="img"
          ></canvas>
          <dl id="result-stats" class="result-stats"></dl>
          <p id="result-landmarks" class="journal-landmarks"></p>
          <div class="actions">
            <button type="button" id="btn-retry" class="btn primary"></button
            ><button type="button" id="btn-result-back" class="btn"></button>
          </div>
        </section>
        <div id="touch" class="touch hidden">
          <div id="stick" class="stick" aria-hidden="true"><i></i></div>
          <button type="button" id="dash-btn" class="dash-btn"></button>
        </div>
      </div>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
