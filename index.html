<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F0E4" />
    <title>猫猫守夜</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-style="paper">
    <div id="app">
      <canvas id="game" width="640" height="400" aria-label="猫猫守夜"></canvas>
      <div id="overlay">
        <section id="title-screen" class="title-layer">
          <div class="title-hero">
            <p id="title-sub" class="eyebrow">Midnight Meow</p>
            <h1 id="title-name">猫猫守夜</h1>
            <p id="title-tag" class="tagline"></p>
          </div>
          <div class="title-play">
            <div class="roles">
              <span id="nicole-role">Nicole</span>
              <span id="zero-role">Zero</span>
            </div>
            <button type="button" id="btn-start" class="btn primary"></button>
            <p id="title-controls" class="hint"></p>
          </div>
          <div class="corner corner-tr">
            <button type="button" id="btn-style" class="btn ghost"></button>
            <button type="button" id="btn-lang" class="btn ghost"></button>
          </div>
          <p id="title-credit" class="credit corner-br"></p>
        </section>

        <div id="hud" class="hud hidden">
          <div class="hud-left">
            <div id="hud-time" class="chip"></div>
            <div id="hud-hearts" class="chip"></div>
            <div id="hud-dash" class="chip"></div>
          </div>
          <div class="hud-right">
            <button type="button" id="hud-style" class="chip btn-chip"></button>
            <button type="button" id="btn-hud-pause" class="chip btn-chip"></button>
          </div>
        </div>

        <section id="pause-screen" class="panel hidden">
          <h2 id="pause-title"></h2>
          <p id="pause-note" class="tagline"></p>
          <div class="actions">
            <button type="button" id="btn-resume" class="btn primary"></button>
            <button type="button" id="btn-pause-style" class="btn"></button>
            <button type="button" id="btn-back" class="btn"></button>
          </div>
        </section>

        <section id="result-screen" class="panel hidden">
          <p id="result-text" class="tagline"></p>
          <div class="actions">
            <button type="button" id="btn-retry" class="btn primary"></button>
            <button type="button" id="btn-result-back" class="btn"></button>
          </div>
        </section>

        <div id="touch" class="touch hidden">
          <div id="stick" class="stick" aria-hidden="true"><i></i></div>
          <button type="button" id="dash-btn" class="dash-btn"></button>
        </div>
      </div>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
