<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101827" />
    <link rel="preload" href="./assets/fonts/AlloVariableFriendly.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/characters/render/cat-reference-atlas.png" as="image" />
    <title>Midnight Meow</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body data-style="pixel" data-cat="zero" data-screen="title">
    <div id="app">
      <canvas id="game" width="960" height="540" aria-label="Midnight Meow"></canvas>
      <section id="title-screen" class="title-layer">
        <header class="title-hero">
          <h1 id="title-name">Midnight Meow</h1>
          <p id="title-tag" class="tagline"></p>
        </header>
        <div class="profile character-showcase">
          <div class="mini-stage" aria-hidden="true">
            <canvas id="profile-portrait" width="232" height="186"></canvas>
          </div>
          <div class="character-caption">
            <div class="profile-title">
              <h3 id="profile-name"></h3>
              <span id="profile-role"></span>
            </div>
            <p id="profile-story"></p>
          </div>
        </div>
        <!-- Pixel roster: choose one cat, inspect its kit, then begin the night. -->
        <div class="selection-panel playbill">
          <h2 id="cat-choice-label" class="selection-heading"></h2>
          <div
            class="cat-choices"
            role="group"
            aria-labelledby="cat-choice-label"
          >
            <!-- One ticket per registered cat, built by src/ui/character-panel.ts. -->
          </div>
          <div class="selection-action">
            <button type="button" id="btn-start" class="btn primary magnetic"></button>
            <p id="title-controls" class="hint"></p>
          </div>
          <div class="wardrobe">
            <p id="wardrobe-label" class="wardrobe-label"></p>
            <div class="wardrobe-strip" role="group" aria-labelledby="wardrobe-label">
              <!-- Plain, then one ticket per registered costume, built by src/ui/character-panel.ts. -->
            </div>
          </div>
          <div class="profile-stats">
            <span id="profile-hp"></span><span id="profile-speed"></span>
          </div>
          <div class="skill-list">
            <details class="skill-row" name="playbill-kit">
              <summary>
                <canvas id="icon-attack" width="64" height="64" aria-hidden="true"></canvas>
                <span class="skill-fold-label">
                  <small id="skill-attack-type"></small>
                  <strong id="skill-attack-name"></strong>
                </span>
              </summary>
              <p id="skill-attack-desc"></p>
            </details>
            <details class="skill-row" name="playbill-kit">
              <summary>
                <canvas id="icon-passive" width="64" height="64" aria-hidden="true"></canvas>
                <span class="skill-fold-label">
                  <small id="skill-passive-type"></small>
                  <strong id="skill-passive-name"></strong>
                </span>
              </summary>
              <p id="skill-passive-desc"></p>
            </details>
          </div>
          <footer class="selection-footer">
            <p id="profile-tactic"></p>
            <p id="profile-build" class="profile-build"></p>
          </footer>
        </div>
        <div class="corner corner-tr">
          <button
            type="button"
            id="btn-mute"
            class="btn ghost sound-toggle"
            aria-pressed="false"
          >
            <span aria-hidden="true">♪</span>
          </button>
          <button type="button" id="btn-lang" class="btn ghost"></button>
        </div>
        <p id="title-credit" class="credit corner-br"></p>
      </section>
      <div id="overlay">
        <div class="hero-caption" aria-hidden="true">
          <strong id="hero-name"></strong><span id="hero-role"></span>
        </div>
        <div id="hud" class="hud hidden">
          <div class="watch-badge">
            <canvas
              id="hud-portrait"
              width="64"
              height="52"
              aria-hidden="true"
            ></canvas>
            <div>
              <strong id="hud-name"></strong>
              <span id="hud-kills"></span>
              <span id="hud-buff" class="buff"></span>
              <span id="hud-costume" class="costume-tag hidden"></span>
            </div>
          </div>
          <div class="night-sky">
            <div class="sky-arc">
              <canvas id="hud-sky" width="440" height="120" aria-hidden="true"></canvas>
              <div class="sky-time">
                <strong id="hud-time"></strong>
                <span id="hud-phase"></span>
              </div>
            </div>
            <canvas
              id="hud-hearts"
              class="lantern-string"
              width="160"
              height="80"
              role="img"
            ></canvas>
          </div>
          <div class="map-corner">
            <div class="hud-actions">
              <button
                type="button"
                id="btn-hud-mute"
                class="btn-chip sound-toggle"
                aria-pressed="false"
              >
                <span aria-hidden="true">♪</span></button
              ><button type="button" id="btn-fullscreen" class="btn-chip">⛶</button
              ><button type="button" id="btn-hud-pause" class="btn-chip"><span class="pause-icon" aria-hidden="true"></span></button>
            </div>
            <canvas
              id="hud-map"
              class="folded-map"
              width="276"
              height="160"
              role="img"
            ></canvas>
          </div>
          <div id="hud-boss" class="boss-bar hidden" role="img">
            <span id="hud-boss-name" class="boss-sleeve"></span>
            <div class="boss-track"><i></i></div>
          </div>
          <div id="hud-streak" class="streak-badge hidden" aria-hidden="true">
            <strong></strong><span></span>
          </div>
          <div id="hud-chest" class="chest-reveal hidden" role="status"></div>
          <div id="boss-banner" class="boss-banner hidden" aria-hidden="true">
            <div class="pleat pleat-1"><span id="boss-banner-kicker"></span></div>
            <div class="pleat pleat-2">
              <strong id="boss-banner-name" class="ink-reveal"></strong>
            </div>
            <div class="pleat pleat-3"><span id="boss-banner-line"></span></div>
          </div>
          <div class="hurt-vignette" aria-hidden="true"></div>
          <div
            id="hud-notice"
            class="notice hidden"
            role="status"
            aria-live="polite"
          ></div>
          <div class="seam-dock">
            <div class="seam-col">
              <div id="hud-upgrades" class="seam-tags"></div>
              <div class="seam-row">
                <span id="hud-level" class="level-button"></span>
                <div id="hud-xp" class="seam" role="progressbar"></div>
              </div>
              <p id="hud-hint" class="game-hint"></p>
            </div>
          </div>
        </div>
        <section id="pause-screen" class="panel journal-page folded hidden">
          <p id="pause-kit" class="eyebrow"></p>
          <h2 id="pause-title"></h2>
          <p id="pause-note" class="hint"></p>
          <div class="actions">
            <button type="button" id="btn-resume" class="btn primary"></button
            ><button type="button" id="btn-pause-lang" class="btn"></button
            ><button type="button" id="btn-back" class="btn"></button>
          </div>
        </section>
        <section
          id="upgrade-screen"
          class="upgrade-screen hidden"
          aria-labelledby="upgrade-title"
        >
          <p id="upgrade-kicker" class="eyebrow"></p>
          <h2 id="upgrade-title"></h2>
          <div class="upgrade-cards">
            <button type="button" id="upgrade-card-0" class="upgrade-card" style="--deal: 0">
              <span class="card-tag"><span class="card-kind"></span><span class="card-pool"></span></span>
              <span class="card-art" aria-hidden="true"><canvas class="card-icon" width="192" height="192"></canvas></span>
              <strong class="card-name"></strong>
              <small class="card-level"><span class="card-level-label"></span><span class="card-pips" aria-hidden="true"></span></small>
              <p class="card-desc"></p>
              <kbd></kbd>
            </button>
            <button type="button" id="upgrade-card-1" class="upgrade-card" style="--deal: 1">
              <span class="card-tag"><span class="card-kind"></span><span class="card-pool"></span></span>
              <span class="card-art" aria-hidden="true"><canvas class="card-icon" width="192" height="192"></canvas></span>
              <strong class="card-name"></strong>
              <small class="card-level"><span class="card-level-label"></span><span class="card-pips" aria-hidden="true"></span></small>
              <p class="card-desc"></p>
              <kbd></kbd>
            </button>
            <button type="button" id="upgrade-card-2" class="upgrade-card" style="--deal: 2">
              <span class="card-tag"><span class="card-kind"></span><span class="card-pool"></span></span>
              <span class="card-art" aria-hidden="true"><canvas class="card-icon" width="192" height="192"></canvas></span>
              <strong class="card-name"></strong>
              <small class="card-level"><span class="card-level-label"></span><span class="card-pips" aria-hidden="true"></span></small>
              <p class="card-desc"></p>
              <kbd></kbd>
            </button>
          </div>
          <p id="upgrade-hint" class="hint"></p>
        </section>
        <section id="result-screen" class="panel journal-page result-panel hidden">
          <p id="result-date" class="journal-date"></p>
          <p id="result-cat" class="eyebrow"></p>
          <h2 id="result-title"></h2>
          <p id="result-text" class="panel-copy"></p>
          <canvas
            id="result-paw"
            class="paw-stamp"
            width="144"
            height="144"
            role="img"
          ></canvas>
          <dl id="result-stats" class="result-stats"></dl>
          <p id="result-landmarks" class="journal-landmarks"></p>
          <p id="result-unlocked" class="journal-unlocked hidden" role="status"></p>
          <div class="actions">
            <button type="button" id="btn-retry" class="btn primary"></button
            ><button type="button" id="btn-result-back" class="btn"></button>
          </div>
        </section>
        <div id="touch" class="touch hidden">
          <div id="stick" class="stick" aria-hidden="true"><i></i></div>
        </div>
      </div>
    </div>
    <!-- ?gallery=1: every registered pixel art entry, painted by src/render/gallery.ts. -->
    <section id="gallery-screen" class="gallery-screen hidden" aria-labelledby="gallery-title">
      <header class="gallery-head">
        <div>
          <p class="eyebrow">MIDNIGHT MEOW</p>
          <h1 id="gallery-title"></h1>
          <p id="gallery-sub" class="gallery-sub"></p>
        </div>
        <button type="button" id="btn-gallery-lang" class="btn ghost"></button>
      </header>
      <div class="gallery-sheet">
        <canvas id="gallery-canvas" role="img"></canvas>
      </div>
    </section>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
